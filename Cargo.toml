[workspace]
resolver = "3"
members = ["bin/hoist", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/TheDhejavu/hoista"
publish = false

[workspace.dependencies]
hoista-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
