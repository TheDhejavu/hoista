name: Signed release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      SQLX_OFFLINE: 'true'
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: rustup target add ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }} -p hoist -p hoistd
      - name: Package binaries, dependency notices and checksums
        run: python scripts/release/package.py
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Sign release archive using GitHub identity
        shell: bash
        run: |
          for archive in release/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes
