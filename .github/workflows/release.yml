name: Signed release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      SQLX_OFFLINE: 'true'
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: rustup target add ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }} -p hoist -p hoistd
      - name: Package binaries, dependency notices and checksums
        run: python scripts/release/package.py
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Sign release archive using GitHub identity
        shell: bash
        run: |
          for archive in release/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin, bundles: dmg}
          - {os: macos-latest, target: x86_64-apple-darwin, bundles: dmg}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage'}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        name: Install the webview's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Build Desktop
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release
          bundle=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release/ \;
          cd release
          [ -n "$(ls)" ] || { echo 'No installers were built.' >&2; exit 1; }
          for file in *; do
            shasum -a 256 "$file" > "$file.sha256"
          done
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Sign installers using GitHub identity
        shell: bash
        run: |
          for file in release/*.dmg release/*.deb release/*.AppImage; do
            [ -e "$file" ] || continue
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Write release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/notes.py "$RELEASE_TAG" > notes.md
      # A tag with a suffix (v0.1.0-beta.1) is a pre-release: GitHub keeps it
      # off /releases/latest, so stable users never land on a beta.
      - name: Create release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag \
            --title "Hoista ${RELEASE_TAG#v}" --notes-file notes.md "${prerelease[@]}"
