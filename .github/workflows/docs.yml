name: Documentation
on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run docs:validate
