oke-dasharray:5 4}#ha-l .dot{fill:#dcdcdc}#ha-l .badge{fill:#111111}#ha-l .ink{fill:#ffffff}#ha-l .eye{fill:#111111}#ha-l .ic{fill:none;stroke:#4a4a4a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ha-l .logo{fill:#7a7a7a}#ha-l .link{fill:none;stroke:#c2c2c2;stroke-width:1.4;stroke-linejoin:round}#ha-l .dash{stroke-dasharray:5 4}#ha-l .head{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ha-l .rule{stroke:#e4e4e7;stroke-dasharray:4 4}</style>
