<svg xmlns="http://www.w3.org/2000/svg" id="ha-l" viewBox="0 0 1280 744" width="1280" height="744" role="img" aria-labelledby="ha-l-t ha-l-d">
<title id="ha-l-t">How Hoista works</title><desc id="ha-l-d">Coding agents connect over stdio, chat apps over HTTP with OAuth, and you through the desktop app or the hoist CLI over a local socket. All of them reach hoistd, the engine, which runs on your computer or as a remote in your own account. hoistd checks each caller's access, keeps its state in SQLite, works with your providers through their APIs and CLIs, and reads a provider token only for the call that needs it.</desc>
