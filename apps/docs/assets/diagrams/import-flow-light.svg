<svg xmlns="http://www.w3.org/2000/svg" id="if-l" viewBox="0 0 1280 564" width="1280" height="564" role="img" aria-labelledby="if-l-t if-l-d">
<title id="if-l-t">Importing a project</title><desc id="if-l-d">Hoista finds the resources on your connected accounts and groups them by provider project. You review and import them as a watching project. Linking a source and switching to managed is a separate step you take later.</desc>
<style>#if-l text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#111111}#if-l .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#if-l .h2{fill:#6b6b6b}#if-l .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#if-l .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#9a9a9a;letter-spacing:0.08em}#if-l .eyebrow{font-size:12.5px;fill:#8f8f8f}#if-l .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#if-l .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#if-l .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#737373}#if-l .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#4a4a4a}#if-l .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#888888}#if-l .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#111111;letter-spacing:0.06em}#if-l .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8a8a8a}#if-l .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#555555}#if-l .sheet{fill:#ffffff;stroke:#e4e4e7}#if-l .card{fill:#ffffff;stroke:#e3e3e3}#if-l .hoistd{fill:#ffffff;stroke:#111111;stroke-width:1.4}#if-l .ring{fill:none;stroke:rgba(0,0,0,0.04);stroke-width:8}#if-l .tile{fill:#f5f5f5;stroke:#e6e6e6}#if-l .chip{fill:#f0f0f0;stroke:#e2e2e2}#if-l .pill{fill:#ffffff;stroke:#e3e3e3}#if-l .zone{fill:#fafafa;stroke:#cfcfcf;stroke-dasharray:5 4}#if-l .dot{fill:#dcdcdc}#if-l .badge{fill:#111111}#if-l .ink{fill:#ffffff}#if-l .eye{fill:#111111}#if-l .ic{fill:none;stroke:#4a4a4a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#if-l .logo{fill:#7a7a7a}#if-l .link{fill:none;stroke:#c2c2c2;stroke-width:1.4;stroke-linejoin:round}#if-l .dash{stroke-dasharray:5 4}#if-l .head{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#if-l .rule{stroke:#e4e4e7;stroke-dasharray:4 4}</style>
<defs><g id="if-l-mascot"><g fill="#ffffff"><rect x="25" y="6" width="50" height="12" rx="6"/><rect x="8" y="24" width="22" height="58" rx="11"/><rect x="70" y="24" width="22" height="58" rx="11"/><circle cx="50" cy="53" r="22"/><rect x="8" y="53" width="84" height="25" rx="6"/><rect x="8" y="58" width="30" height="36" rx="15"/><rect x="62" y="58" width="30" height="36" rx="15"/></g><g fill="#111111"><rect x="41" y="43" width="6.5" height="11" rx="3.25" transform="rotate(-10 44 48)"/><rect x="52.5" y="41" width="6.5" height="11" rx="3.25" transform="rotate(-10 56 46)"/></g></g><marker id="if-l-open" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3.5 1.8 10.5 6 3.5 10.2" class="head"/></marker></defs>
