<svg xmlns="http://www.w3.org/2000/svg" id="en-l" viewBox="0 0 1280 576" width="1280" height="576" role="img" aria-labelledby="en-l-t en-l-d">
<title id="en-l-t">Environments</title><desc id="en-l-d">Projects sit in one environment each, such as default or production. Provider accounts, agents, settings and billing are shared by every environment.</desc>
<style>#en-l text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#111111}#en-l .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#en-l .h2{fill:#6b6b6b}#en-l .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#en-l .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#9a9a9a;letter-spacing:0.08em}#en-l .eyebrow{font-size:12.5px;fill:#8f8f8f}#en-l .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#en-l .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#en-l .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#737373}#en-l .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#4a4a4a}#en-l .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#888888}#en-l .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#111111;letter-spacing:0.06em}#en-l .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8a8a8a}#en-l .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#555555}#en-l .sheet{fill:#ffffff;stroke:#e4e4e7}#en-l .card{fill:#ffffff;stroke:#e3e3e3}#en-l .hoistd{fill:#ffffff;stroke:#111111;stroke-width:1.4}#en-l .ring{fill:none;stroke:rgba(0,0,0,0.04);stroke-width:8}#en-l .tile{fill:#f5f5f5;stroke:#e6e6e6}#en-l .chip{fill:#f0f0f0;stroke:#e2e2e2}#en-l .pill{fill:#ffffff;stroke:#e3e3e3}#en-l .zone{fill:#fafafa;stroke:#cfcfcf;stroke-dasharray:5 4}#en-l .dot{fill:#dcdcdc}#en-l .badge{fill:#111111}#en-l .ink{fill:#ffffff}#en-l .eye{fill:#111111}#en-l .ic{fill:none;stroke:#4a4a4a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#en-l .logo{fill:#7a7a7a}#en-l .link{fill:none;stroke:#c2c2c2;stroke-width:1.4;stroke-linejoin:round}#en-l .dash{stroke-dasharray:5 4}#en-l .head{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#en-l .rule{stroke:#e4e4e7;stroke-dasharray:4 4}</style>
