<rect x="68" y="432" width="32" height="32" rx="8" class="tile"/>
<g class="ic" transform="translate(76 440)"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></g>
<text x="116" y="445" class="eyebrow">Found on your providers</text>
<text x="116" y="468" class="title">Ready to add</text>
