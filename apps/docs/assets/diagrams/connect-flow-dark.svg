<svg xmlns="http://www.w3.org/2000/svg" id="cf-d" viewBox="0 0 1280 564" width="1280" height="564" role="img" aria-labelledby="cf-d-t cf-d-d">
<title id="cf-d-t">Connecting a provider</title><desc id="cf-d-d">You approve Hoista on the provider’s page or paste a token. hoistd checks it works, keeps it in the keychain, reads the account and lists the projects it finds, ready to add.</desc>
<style>#cf-d text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#ededed}#cf-d .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#cf-d .h2{fill:#a1a1aa}#cf-d .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#cf-d .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#7a7a82;letter-spacing:0.08em}#cf-d .eyebrow{font-size:12.5px;fill:#8b8b93}#cf-d .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#cf-d .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#cf-d .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#a1a1aa}#cf-d .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#d4d4d8}#cf-d .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#cf-d .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#ededed;letter-spacing:0.06em}#cf-d .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#cf-d .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#c8c8cc}#cf-d .sheet{fill:#0a0a0a;stroke:#262626}#cf-d .card{fill:#141414;stroke:#2a2a2a}#cf-d .hoistd{fill:#141414;stroke:#ededed;stroke-width:1.4}#cf-d .ring{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:8}#cf-d .tile{fill:#1c1c1c;stroke:#2e2e2e}#cf-d .chip{fill:#1c1c1c;stroke:#2e2e2e}#cf-d .pill{fill:#141414;stroke:#2e2e2e}#cf-d .zone{fill:#111111;stroke:#3a3a3a;stroke-dasharray:5 4}#cf-d .dot{fill:#3f3f46}#cf-d .badge{fill:#ededed}#cf-d .ink{fill:#0a0a0a}#cf-d .eye{fill:#ededed}#cf-d .ic{fill:none;stroke:#d4d4d8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#cf-d .logo{fill:#a1a1aa}#cf-d .link{fill:none;stroke:#4f4f56;stroke-width:1.4;stroke-linejoin:round}#cf-d .dash{stroke-dasharray:5 4}#cf-d .head{fill:none;stroke:#7a7a82;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#cf-d .rule{stroke:#262626;stroke-dasharray:4 4}</style>
<defs><g id="cf-d-mascot"><g fill="#0a0a0a"><rect x="25" y="6" width="50" height="12" rx="6"/><rect x="8" y="24" width="22" height="58" rx="11"/><rect x="70" y="24" width="22" height="58" rx="11"/><circle cx="50" cy="53" r="22"/><rect x="8" y="53" width="84" height="25" rx="6"/><rect x="8" y="58" width="30" height="36" rx="15"/><rect x="62" y="58" width="30" height="36" rx="15"/></g><g fill="#ededed"><rect x="41" y="43" width="6.5" height="11" rx="3.25" transform="rotate(-10 44 48)"/><rect x="52.5" y="41" width="6.5" height="11" rx="3.25" transform="rotate(-10 56 46)"/></g></g><marker id="cf-d-open" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3.5 1.8 10.5 6 3.5 10.2" class="head"/></marker></defs>
