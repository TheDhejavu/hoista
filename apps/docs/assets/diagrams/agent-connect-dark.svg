<svg xmlns="http://www.w3.org/2000/svg" id="ac-d" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="ac-d-t ac-d-d">
<title id="ac-d-t">Connecting an agent</title><desc id="ac-d-d">A coding agent starts hoist mcp and asks the daemon to connect. Hoista shows you the request with a code, in the app or a browser page. You allow it with an access level, and from then on the daemon checks each call the agent makes against that access.</desc>
<style>#ac-d text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#ededed}#ac-d .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#ac-d .h2{fill:#a1a1aa}#ac-d .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#ac-d .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#7a7a82;letter-spacing:0.08em}#ac-d .eyebrow{font-size:12.5px;fill:#8b8b93}#ac-d .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#ac-d .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#ac-d .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#a1a1aa}#ac-d .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#d4d4d8}#ac-d .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#ac-d .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#ededed;letter-spacing:0.06em}#ac-d .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#ac-d .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#c8c8cc}#ac-d .sheet{fill:#0a0a0a;stroke:#262626}#ac-d .card{fill:#141414;stroke:#2a2a2a}#ac-d .hoistd{fill:#141414;stroke:#ededed;stroke-width:1.4}#ac-d .ring{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:8}#ac-d .tile{fill:#1c1c1c;stroke:#2e2e2e}#ac-d .chip{fill:#1c1c1c;stroke:#2e2e2e}#ac-d .pill{fill:#141414;stroke:#2e2e2e}#ac-d .zone{fill:#111111;stroke:#3a3a3a;stroke-dasharray:5 4}#ac-d .dot{fill:#3f3f46}#ac-d .badge{fill:#ededed}#ac-d .ink{fill:#0a0a0a}#ac-d .eye{fill:#ededed}#ac-d .ic{fill:none;stroke:#d4d4d8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ac-d .logo{fill:#a1a1aa}#ac-d .link{fill:none;stroke:#4f4f56;stroke-width:1.4;stroke-linejoin:round}#ac-d .dash{stroke-dasharray:5 4}#ac-d .head{fill:none;stroke:#7a7a82;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ac-d .rule{stroke:#262626;stroke-dasharray:4 4}</style>
<defs><g id="ac-d-mascot"><g fill="#0a0a0a"><rect x="25" y="6" width="50" height="12" rx="6"/><rect x="8" y="24" width="22" height="58" rx="11"/><rect x="70" y="24" width="22" height="58" rx="11"/><circle cx="50" cy="53" r="22"/><rect x="8" y="53" width="84" height="25" rx="6"/><rect x="8" y="58" width="30" height="36" rx="15"/><rect x="62" y="58" width="30" height="36" rx="15"/></g><g fill="#ededed"><rect x="41" y="43" width="6.5" height="11" rx="3.25" transform="rotate(-10 44 48)"/><rect x="52.5" y="41" width="6.5" height="11" rx="3.25" transform="rotate(-10 56 46)"/></g></g><marker id="ac-d-open" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3.5 1.8 10.5 6 3.5 10.2" class="head"/></marker><filter id="ac-d-lift" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.36"/><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/></filter><filter id="ac-d-lift2" x="-15%" y="-25%" width="130%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter></defs>
