<text x="932" y="132" class="col">IN HOISTA</text>
<rect x="361.6" y="196" width="86.8" height="24" rx="7" class="pill"/><text x="405" y="212.2" class="pill-t" text-anchor="middle">discovers</text>
<rect x="842.4" y="196" width="65.2" height="24" rx="7" class="pill"/><text x="875" y="212.2" class="pill-t" text-anchor="middle">import</text>
