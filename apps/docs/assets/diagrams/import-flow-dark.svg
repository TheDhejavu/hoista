<path d="M800 208 L929 208" class="link" marker-end="url(#if-d-open)"/>
<path d="M1082 276 L1082 409" class="link dash" marker-end="url(#if-d-open)"/>
<rect x="48" y="172" width="300" height="106" rx="12" class="card" filter="url(#if-d-lift)"/>
