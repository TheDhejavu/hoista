<g class="ic" transform="translate(960 200)"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></g>
<text x="1000" y="205" class="eyebrow">Watching project</text>
<text x="1000" y="228" class="title">my-app</text>
<text x="1000" y="254" class="detail">status · logs</text>
<rect x="932" y="412" width="300" height="106" rx="12" class="card" filter="url(#if-d-lift)"/>
<rect x="952" y="432" width="32" height="32" rx="8" class="tile"/>
<g class="ic" transform="translate(960 440)"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></g>
<text x="1000" y="445" class="eyebrow">Managed project</text>
<text x="1000" y="468" class="title">my-app</text>
<text x="1000" y="494" class="detail">Hoista deploys it</text>
<rect x="48.0" y="38" width="147.9" height="44" rx="10" class="chip"/>
<text x="59.0" y="70" class="headline">Importing</text>
<text x="204.9" y="70" class="headline">a project</text>
