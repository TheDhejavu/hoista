oke-dasharray:5 4}#wm-l .dot{fill:#dcdcdc}#wm-l .badge{fill:#111111}#wm-l .ink{fill:#ffffff}#wm-l .eye{fill:#111111}#wm-l .ic{fill:none;stroke:#4a4a4a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#wm-l .logo{fill:#7a7a7a}#wm-l .link{fill:none;stroke:#c2c2c2;stroke-width:1.4;stroke-linejoin:round}#wm-l .dash{stroke-dasharray:5 4}#wm-l .head{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#wm-l .rule{stroke:#e4e4e7;stroke-dasharray:4 4}</style>
