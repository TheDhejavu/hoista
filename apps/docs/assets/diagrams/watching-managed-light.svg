<svg xmlns="http://www.w3.org/2000/svg" id="wm-l" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="wm-l-t wm-l-d">
<title id="wm-l-t">Watching and managed projects</title><desc id="wm-l-d">Watching: the provider builds from your repository on its own, and Hoista reads its status, deploys, logs and metrics. Managed: Hoista plans and starts the deploy from your folder or GitHub repository.</desc>
