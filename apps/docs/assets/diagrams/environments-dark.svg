<svg xmlns="http://www.w3.org/2000/svg" id="en-d" viewBox="0 0 1280 576" width="1280" height="576" role="img" aria-labelledby="en-d-t en-d-d">
<title id="en-d-t">Environments</title><desc id="en-d-d">Projects sit in one environment each, such as default or production. Provider accounts, agents, settings and billing are shared by every environment.</desc>
<style>#en-d text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#ededed}#en-d .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#en-d .h2{fill:#a1a1aa}#en-d .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#en-d .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#7a7a82;letter-spacing:0.08em}#en-d .eyebrow{font-size:12.5px;fill:#8b8b93}#en-d .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#en-d .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#en-d .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#a1a1aa}#en-d .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#d4d4d8}#en-d .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#en-d .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#ededed;letter-spacing:0.06em}#en-d .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#en-d .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#c8c8cc}#en-d .sheet{fill:#0a0a0a;stroke:#262626}#en-d .card{fill:#141414;stroke:#2a2a2a}#en-d .hoistd{fill:#141414;stroke:#ededed;stroke-width:1.4}#en-d .ring{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:8}#en-d .tile{fill:#1c1c1c;stroke:#2e2e2e}#en-d .chip{fill:#1c1c1c;stroke:#2e2e2e}#en-d .pill{fill:#141414;stroke:#2e2e2e}#en-d .zone{fill:#111111;stroke:#3a3a3a;stroke-dasharray:5 4}#en-d .dot{fill:#3f3f46}#en-d .badge{fill:#ededed}#en-d .ink{fill:#0a0a0a}#en-d .eye{fill:#ededed}#en-d .ic{fill:none;stroke:#d4d4d8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#en-d .logo{fill:#a1a1aa}#en-d .link{fill:none;stroke:#4f4f56;stroke-width:1.4;stroke-linejoin:round}#en-d .dash{stroke-dasharray:5 4}#en-d .head{fill:none;stroke:#7a7a82;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#en-d .rule{stroke:#262626;stroke-dasharray:4 4}</style>
