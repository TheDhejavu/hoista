<svg xmlns="http://www.w3.org/2000/svg" id="ac-l" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="ac-l-t ac-l-d">
<title id="ac-l-t">Connecting an agent</title><desc id="ac-l-d">A coding agent starts hoist mcp and asks the daemon to connect. Hoista shows you the request with a code, in the app or a browser page. You allow it with an access level, and from then on the daemon checks each call the agent makes against that access.</desc>
<style>#ac-l text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#111111}#ac-l .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#ac-l .h2{fill:#6b6b6b}#ac-l .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#ac-l .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#9a9a9a;letter-spacing:0.08em}#ac-l .eyebrow{font-size:12.5px;fill:#8f8f8f}#ac-l .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#ac-l .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#ac-l .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#737373}#ac-l .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#4a4a4a}#ac-l .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#888888}#ac-l .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#111111;letter-spacing:0.06em}#ac-l .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8a8a8a}#ac-l .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#555555}#ac-l .sheet{fill:#ffffff;stroke:#e4e4e7}#ac-l .card{fill:#ffffff;stroke:#e3e3e3}#ac-l .hoistd{fill:#ffffff;stroke:#111111;stroke-width:1.4}#ac-l .ring{fill:none;stroke:rgba(0,0,0,0.04);stroke-width:8}#ac-l .tile{fill:#f5f5f5;stroke:#e6e6e6}#ac-l .chip{fill:#f0f0f0;stroke:#e2e2e2}#ac-l .pill{fill:#ffffff;stroke:#e3e3e3}#ac-l .zone{fill:#fafafa;stroke:#cfcfcf;stroke-dasharray:5 4}#ac-l .dot{fill:#dcdcdc}#ac-l .badge{fill:#111111}#ac-l .ink{fill:#ffffff}#ac-l .eye{fill:#111111}#ac-l .ic{fill:none;stroke:#4a4a4a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ac-l .logo{fill:#7a7a7a}#ac-l .link{fill:none;stroke:#c2c2c2;stroke-width:1.4;stroke-linejoin:round}#ac-l .dash{stroke-dasharray:5 4}#ac-l .head{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#ac-l .rule{stroke:#e4e4e7;stroke-dasharray:4 4}</style>
