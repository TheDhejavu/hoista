<svg xmlns="http://www.w3.org/2000/svg" id="ac-l" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="ac-l-t ac-l-d">
<title id="ac-l-t">Connecting an agent</title><desc id="ac-l-d">A coding agent starts hoist mcp and asks the daemon to connect. Hoista shows you the request with a code, in the app or a browser page. You allow it with an access level, and from then on the daemon checks each call the agent makes against that access.</desc>
