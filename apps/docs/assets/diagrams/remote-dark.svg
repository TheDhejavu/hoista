<svg xmlns="http://www.w3.org/2000/svg" id="rm-d" viewBox="0 0 1280 616" width="1280" height="616" role="img" aria-labelledby="rm-d-t rm-d-d">
<title id="rm-d-t">Your remote</title><desc id="rm-d-d">A remote runs in your own Railway or Fly.io account. Your computer reaches it with a key you approved with your passkey, and chat apps through /mcp with OAuth. The gateway keeps projects and approvals; a separate credential keeper holds the provider tokens in a sealed file and adds them to provider requests.</desc>
<style>#rm-d text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif;fill:#ededed}#rm-d .headline{font-size:30px;font-weight:600;letter-spacing:-0.75px}#rm-d .h2{fill:#a1a1aa}#rm-d .brand{font-size:19px;font-weight:600;letter-spacing:-0.2px}#rm-d .col{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#7a7a82;letter-spacing:0.08em}#rm-d .eyebrow{font-size:12.5px;fill:#8b8b93}#rm-d .title{font-size:17px;font-weight:600;letter-spacing:-0.3px}#rm-d .title-lg{font-size:20px;font-weight:600;letter-spacing:-0.4px}#rm-d .detail{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px;fill:#a1a1aa}#rm-d .glyph{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;font-weight:600;fill:#d4d4d8}#rm-d .note{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#rm-d .note-h{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;font-weight:600;fill:#ededed;letter-spacing:0.06em}#rm-d .zl{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8b8b93}#rm-d .pill-t{font-family:'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#c8c8cc}#rm-d .sheet{fill:#0a0a0a;stroke:#262626}#rm-d .card{fill:#141414;stroke:#2a2a2a}#rm-d .hoistd{fill:#141414;stroke:#ededed;stroke-width:1.4}#rm-d .ring{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:8}#rm-d .tile{fill:#1c1c1c;stroke:#2e2e2e}#rm-d .chip{fill:#1c1c1c;stroke:#2e2e2e}#rm-d .pill{fill:#141414;stroke:#2e2e2e}#rm-d .zone{fill:#111111;stroke:#3a3a3a;stroke-dasharray:5 4}#rm-d .dot{fill:#3f3f46}#rm-d .badge{fill:#ededed}#rm-d .ink{fill:#0a0a0a}#rm-d .eye{fill:#ededed}#rm-d .ic{fill:none;stroke:#d4d4d8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#rm-d .logo{fill:#a1a1aa}#rm-d .link{fill:none;stroke:#4f4f56;stroke-width:1.4;stroke-linejoin:round}#rm-d .dash{stroke-dasharray:5 4}#rm-d .head{fill:none;stroke:#7a7a82;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#rm-d .rule{stroke:#262626;stroke-dasharray:4 4}</style>
