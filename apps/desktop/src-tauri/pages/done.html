<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f4;
        --card: #fff;
        --line: #e6e6e6;
        --text: #111;
        --sub: #666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --card: #171717;
          --line: #2a2a2a;
          --text: #f2f2f2;
          --sub: #a0a0a0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 Inter,
          -apple-system,
          system-ui,
          sans-serif;
      }
      .card {
        width: min(380px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 30px 32px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        text-align: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 21px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--sub);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>{{title}}</h1>
      <p>{{text}}</p>
    </div>
  </body>
</html>
